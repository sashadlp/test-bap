<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Étoiles et rayures stylisées et le mot « English »">
	<defs>
		<linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#04234E"/>
			<stop offset="1" stop-color="#0A3775"/>
		</linearGradient>
		<!-- Étoile à 5 branches. -->
		<path id="etoile" d="M0 -10 L2.35 -3.24 L9.51 -3.09 L3.8 1.24 L5.88 8.09 L0 4 L-5.88 8.09 L-3.8 1.24 L-9.51 -3.09 L-2.35 -3.24 Z"/>
		<!-- Semis d'étoiles en quinconce. -->
		<pattern id="semis" width="90" height="90" patternUnits="userSpaceOnUse">
			<use href="#etoile" transform="translate(22 22) scale(0.75)" fill="#FFFFFF" fill-opacity="0.16"/>
			<use href="#etoile" transform="translate(67 67) scale(0.75)" fill="#FFFFFF" fill-opacity="0.16"/>
		</pattern>
		<linearGradient id="fondu" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
			<stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
		</linearGradient>
		<mask id="masque">
			<rect width="1600" height="480" fill="url(#fondu)"/>
		</mask>
		<!-- Rayures rouges et blanches, découpées dans le disque de droite. -->
		<pattern id="rayures" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
			<rect width="40" height="20" fill="#B22234" fill-opacity="0.85"/>
			<rect y="20" width="40" height="20" fill="#FFFFFF" fill-opacity="0.12"/>
		</pattern>
		<clipPath id="disque">
			<circle cx="1270" cy="240" r="175"/>
		</clipPath>
	</defs>

	<rect width="1600" height="480" fill="url(#fond)"/>
	<rect width="1600" height="480" fill="url(#semis)" mask="url(#masque)"/>

	<!-- Disque rayé et anneaux à droite. -->
	<rect x="1095" y="65" width="350" height="350" fill="url(#rayures)" clip-path="url(#disque)" opacity="0.55"/>
	<g fill="none" stroke="#FFFFFF" stroke-opacity="0.45">
		<circle cx="1270" cy="240" r="190" stroke-width="2"/>
		<circle cx="1270" cy="240" r="175" stroke-width="1.2"/>
	</g>
	<g fill="#FFFFFF" fill-opacity="0.85">
		<use href="#etoile" transform="translate(1270 92) scale(1.6)"/>
		<use href="#etoile" transform="translate(1188 112) scale(1.1)"/>
		<use href="#etoile" transform="translate(1352 112) scale(1.1)"/>
	</g>

	<!-- « English » en lettres italiques. -->
	<text x="1270" y="275" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.95"
		font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="104" font-weight="700">English</text>

	<!-- Liseré rouge en bas. -->
	<rect y="472" width="1600" height="8" fill="#B22234" fill-opacity="0.9"/>
</svg>
