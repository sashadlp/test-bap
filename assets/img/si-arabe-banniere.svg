<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Motif géométrique arabesque et le mot « arabe » en calligraphie">
	<defs>
		<linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#04234E"/>
			<stop offset="1" stop-color="#0A3775"/>
		</linearGradient>
		<!-- Étoile à 8 branches (khatam) : deux carrés tournés, répétés en mosaïque. -->
		<pattern id="motif" width="80" height="80" patternUnits="userSpaceOnUse">
			<g fill="none" stroke="#D9B66C" stroke-width="1.4" stroke-opacity="0.35">
				<rect x="22" y="22" width="36" height="36"/>
				<rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
				<circle cx="40" cy="40" r="7"/>
				<path d="M0 0 L22 22 M80 0 L58 22 M0 80 L22 58 M80 80 L58 58"/>
			</g>
		</pattern>
		<!-- Le motif s'efface vers la gauche pour laisser respirer. -->
		<linearGradient id="fondu" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
			<stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
		</linearGradient>
		<mask id="masque">
			<rect width="1600" height="480" fill="url(#fondu)"/>
		</mask>
	</defs>

	<rect width="1600" height="480" fill="url(#fond)"/>
	<rect width="1600" height="480" fill="url(#motif)" mask="url(#masque)"/>

	<!-- Grande rosace décorative à droite. -->
	<g transform="translate(1270 240)" fill="none" stroke="#D9B66C" stroke-opacity="0.55">
		<circle r="190" stroke-width="2"/>
		<circle r="150" stroke-width="1.2"/>
		<rect x="-120" y="-120" width="240" height="240" stroke-width="2"/>
		<rect x="-120" y="-120" width="240" height="240" stroke-width="2" transform="rotate(45)"/>
		<rect x="-85" y="-85" width="170" height="170" stroke-width="1.2" transform="rotate(22.5)"/>
		<rect x="-85" y="-85" width="170" height="170" stroke-width="1.2" transform="rotate(67.5)"/>
		<circle r="40" stroke-width="1.5"/>
	</g>

	<!-- « العربية » (l'arabe) en calligraphie. -->
	<text x="1270" y="268" text-anchor="middle" direction="rtl" fill="#FFFFFF" fill-opacity="0.92"
		font-family="'Amiri', 'Traditional Arabic', 'Arabic Typesetting', 'Geeza Pro', 'Noto Naskh Arabic', 'Segoe UI', serif"
		font-size="96" font-weight="700">العربية</text>

	<!-- Liseré doré en bas. -->
	<rect y="472" width="1600" height="8" fill="#D9B66C" fill-opacity="0.8"/>
</svg>
