<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Motif géométrique arabesque">
	<defs>
		<linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#04234E"/>
			<stop offset="1" stop-color="#0A3775"/>
		</linearGradient>
		<!-- Étoile à 8 branches (khatam) : deux carrés tournés, répétés en mosaïque. -->
		<pattern id="motif" width="80" height="80" patternUnits="userSpaceOnUse">
			<g fill="none" stroke="#D9B66C" stroke-width="1.4" stroke-opacity="0.35">
				<rect x="22" y="22" width="36" height="36"/>
				<rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
				<circle cx="40" cy="40" r="7"/>
				<path d="M0 0 L22 22 M80 0 L58 22 M0 80 L22 58 M80 80 L58 58"/>
			</g>
		</pattern>
	</defs>

	<rect width="1600" height="480" fill="url(#fond)"/>
	<rect width="1600" height="480" fill="url(#motif)"/>

	<!-- Liseré doré en bas. -->
	<rect y="472" width="1600" height="8" fill="#D9B66C" fill-opacity="0.8"/>
</svg>
